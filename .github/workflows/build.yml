name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Code matches D5 (AGENTS.md section 9)
        run: python3 scripts/check-d5-conformance.py
      - name: Layer rules R1-R12 (AGENTS.md section 5)
        run: bash scripts/check-architecture.sh
      - name: Compile + unit tests (no database needed)
        run: mvn -B -q verify
